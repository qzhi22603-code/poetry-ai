<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>poemly · 诗阁</title>
<link rel="icon" href="poemly_favicon.ico">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"Microsoft YaHei",serif; background:#f4f1ea; height:100vh; display:flex; flex-direction:column; }
header { background:#2c3e50; color:#f9f4e6; padding:14px 24px; display:flex; justify-content:space-between; align-items:center; }
header h1 { font-size:20px; font-weight:600; letter-spacing:6px; }
header span { font-size:12px; opacity:.6; }
#chat { flex:1; overflow-y:auto; padding:24px; max-width:820px; width:100%; margin:0 auto; }
.msg { margin-bottom:20px; display:flex; }
.msg.user { justify-content:flex-end; }
.msg.ai { gap:10px; align-items:flex-start; }
.msg.ai .avt { width:34px; height:34px; border-radius:50%; border:1.5px solid #d8b96a; background:#f4f1ea; flex-shrink:0; margin-top:2px; }
.welcome { text-align:center; padding:30px 12px 14px; }
.welcome img { width:180px; border-radius:20px; box-shadow:0 6px 24px rgba(90,74,45,.18); }
.welcome h2 { margin-top:16px; font-size:20px; letter-spacing:5px; color:#2c3e50; }
.welcome p { margin-top:8px; font-size:13px; color:#8a8271; line-height:2; }
.bubble { max-width:75%; padding:12px 18px; border-radius:12px; line-height:1.8; font-size:15px; white-space:pre-wrap; }
.msg.user .bubble { background:#2c3e50; color:#f9f4e6; border-bottom-right-radius:4px; }
.msg.ai .bubble { background:#fff; color:#2c2c2c; border-bottom-left-radius:4px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
.msg.ai .bubble em { color:#8a6d3b; font-style:normal; font-size:.9em; display:block; margin-top:6px; padding-top:6px; border-top:1px dashed #d8d2c4; }
#inputbar { background:#fff; padding:14px 24px; border-top:1px solid #e5e0d4; display:flex; gap:12px; max-width:820px; width:100%; margin:0 auto; }
#q { flex:1; border:1px solid #ccc; border-radius:8px; padding:10px 16px; font-size:15px; font-family:inherit; outline:none; }
#q:focus { border-color:#2c3e50; }
#send { background:#2c3e50; color:#f9f4e6; border:none; border-radius:8px; padding:10px 28px; font-size:15px; cursor:pointer; font-family:inherit; }
#send:disabled { background:#999; cursor:not-allowed; }
#clear { background:none; border:1px solid #ccc; border-radius:8px; padding:10px 14px; font-size:13px; color:#666; cursor:pointer; font-family:inherit; }
.tag { font-size:11px; color:#999; margin-top:4px; }
</style>
</head>
<body>
<header>
  <h1>poemly · 诗阁</h1>
  <span>自训诗词模型 · 独立创作 · 平水韵</span>
</header>
<div id="chat"></div>
<form id="inputbar">
  <input id="q" placeholder="出题吧，例如：以《春雨》为题作一首七言绝句" autocomplete="off" autofocus>
  <button id="send" type="submit">发送</button>
  <button id="clear" type="button" onclick="localStorage.clear();location.reload()">清空</button>
</form>
<script>
const PERSONA = "你是poemly，一位精通古典诗词的创作助手。用韵依平水韵，讲究平仄对仗，先立意后作诗，写完逐联解意象。作诗必须独立创作，绝不抄录古人现成诗句；只有用户要求默写时才引原作。";
let history = JSON.parse(localStorage.getItem("poemly_hist") || "[]");
const chat = document.getElementById("chat");

// 上下文瘦身：发往模型的历史里，诗歌回答只保留"诗体"，立意/意象解释不入上下文
// （界面显示与 localStorage 仍存全文，仅影响每次请求打包的内容）
function slimAssistant(t) {
  if (!t) return t;
  try {
    const ie = t.indexOf("意象解释");
    if (ie === -1) return t;              // 非诗歌回答：保留原文
    let body = t.slice(0, ie);
    const m = body.match(/(?:^|\n)\s*诗[：:]?/);   // 定位"诗"段落起始行
    if (!m) return t;
    return body.slice(m.index).replace(/\n{3,}/g, "\n\n").trim();
  } catch (e) { return t; }
}

function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  if (cls === "ai") {
    const av = document.createElement("img");
    av.className = "avt";
    av.src = "poemly_avatar.png";
    av.alt = "poemly";
    d.appendChild(av);
  }
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  d.appendChild(b);
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return b;
}
if (history.length) {
  history.forEach(m => add(m.role === "user" ? "user" : "ai", m.content));
} else {
  const w = document.createElement("div");
  w.className = "welcome";
  w.innerHTML = '<img src="poemly_standing.png" alt="poemly">'
    + '<h2>poemly · 诗阁</h2>'
    + '<p>自训诗词模型 v2.1 · 独立创作 · 平水韵<br>出题便是——五言七言、绝句律诗皆可，查韵问典亦无不可。</p>';
  chat.appendChild(w);
}

document.getElementById("inputbar").onsubmit = async (e) => {
  e.preventDefault();
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  document.getElementById("q").value = "";
  add("user", q);
  history.push({ role: "user", content: q });
  const bub = add("ai", "…");
  document.getElementById("send").disabled = true;
  try {
    const msgs = history.slice(-12).map(m => ({ role: m.role, content: m.role === "assistant" ? slimAssistant(m.content) : m.content }));
    const r = await fetch("http://127.0.0.1:11499/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: "poemly-v21", max_tokens: 896, stream: true, system: PERSONA, messages: msgs })
    });
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let acc = "", buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      for (const line of buf.split("\n")) {
        if (!line.startsWith("data:")) continue;
        try {
          const ev = JSON.parse(line.slice(5));
          if (ev.type === "content_block_delta" && ev.delta && ev.delta.type === "text_delta")
            acc += ev.delta.text;
        } catch (_) {}
      }
      buf = buf.slice(buf.lastIndexOf("\n") + 1);
      bub.textContent = acc || "…";
      chat.scrollTop = chat.scrollHeight;
    }
    bub.textContent = acc || "（空响应）";
    history.push({ role: "assistant", content: acc || "…" });
    localStorage.setItem("poemly_hist", JSON.stringify(history.slice(-40)));
  } catch (err) {
    bub.textContent = "连接失败：" + err.message + "\n（代理可能未运行，稍等再试或重启电脑）";
    // 失败时回滚：把刚 push 的 user 消息移除，让用户可以重发
    if (history.length && history[history.length - 1].role === "user") {
      history.pop();
      localStorage.setItem("poemly_hist", JSON.stringify(history.slice(-40)));
    }
  }
  document.getElementById("send").disabled = false;
  document.getElementById("q").focus();
};
</script>
</body>
</html>
